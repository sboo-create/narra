<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Narra · Product analytics</title>
  <style>
    :root{color-scheme:light;--ink:#151515;--muted:#6e6e69;--line:#deded7;--paper:#f5f5ef;--card:#fff;--acid:#b8ff39;--red:#d84242;--blue:#3763e8}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,sans-serif}main{width:min(1180px,calc(100% - 32px));margin:auto;padding:28px 0 56px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:26px}.brand{display:flex;align-items:center;gap:13px}.brand img{width:46px;height:46px}.eyebrow{color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}.brand h1{font-size:24px;line-height:1.1;margin:3px 0 0}.period{display:flex;background:#e9e9e2;border-radius:12px;padding:4px}.period button{appearance:none;border:0;background:transparent;border-radius:9px;padding:8px 12px;color:var(--muted);font:inherit;font-weight:700;cursor:pointer}.period button.active{background:#111;color:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:17px;box-shadow:0 1px 0 rgba(0,0,0,.03)}.card{padding:18px}.label{color:var(--muted);font-size:12px}.value{font-size:32px;font-weight:760;letter-spacing:-.04em;margin:6px 0 2px}.note{color:var(--muted);font-size:11px}.layout{display:grid;grid-template-columns:1.4fr 1fr;gap:12px;margin-top:12px}.panel{padding:20px}.panel h2{font-size:15px;margin:0 0 3px}.sub{color:var(--muted);font-size:12px;margin-bottom:18px}.chart{height:210px;display:flex;align-items:flex-end;gap:7px;border-bottom:1px solid var(--line);padding-top:10px}.bar-group{height:100%;flex:1;display:flex;align-items:flex-end;justify-content:center;gap:2px;position:relative}.bar{width:7px;min-height:2px;border-radius:4px 4px 0 0;background:var(--acid)}.bar.sessions{background:#111}.bar.tools{background:var(--blue)}.bar-group span{position:absolute;bottom:-22px;color:var(--muted);font-size:9px}.legend{display:flex;gap:15px;margin-top:30px;color:var(--muted);font-size:11px}.legend i{display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:5px}.rows{display:grid;gap:11px}.row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.track{height:7px;background:#ecece6;border-radius:9px;overflow:hidden;margin-top:5px}.fill{height:100%;background:var(--acid);border-radius:9px}.metric{font-weight:750}.ai{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.mini{padding:13px;border-radius:13px;background:#f5f5ef}.mini b{display:block;font-size:21px;margin-top:3px}.quality{margin-top:12px}.warning{padding:10px 12px;border-radius:11px;background:#fff4d8;color:#795b00;margin-top:8px}.ok{padding:10px 12px;border-radius:11px;background:#ebfbd2;color:#315900}.footer{color:var(--muted);font-size:11px;margin-top:14px;display:flex;justify-content:space-between}.empty{color:var(--muted);padding:30px 0;text-align:center}.error{padding:16px;border-radius:13px;background:#fee;color:#920}
    details.panel{padding:0}details.panel>summary{cursor:pointer;list-style:none;padding:20px;font-weight:760;font-size:15px}details.panel>summary::-webkit-details-marker{display:none}details.panel>summary:after{content:'+';float:right;color:var(--muted)}details[open].panel>summary:after{content:'−'}details.panel>.inside{padding:0 20px 20px}.retention{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric-help{cursor:help;text-decoration:underline dotted;text-underline-offset:3px}
    @media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.ai{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){main{width:min(100% - 20px,1180px);padding-top:18px}.top{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr 1fr}.card{padding:14px}.value{font-size:25px}.retention{grid-template-columns:1fr}}
  </style>
</head>
<body><main>
  <div class="top"><div class="brand"><img src="logo.svg" alt="Narra"><div><div class="eyebrow">Traction · Product analytics</div><h1>Narra reading health</h1></div></div><div class="period" aria-label="Period"><button data-days="1" class="active">24h</button><button data-days="7">7d</button><button data-days="30">30d</button></div></div>
  <div id="app"><div class="empty">Loading privacy-safe product metrics…</div></div>
</main><script>
const app=document.getElementById('app');let days=1;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=v=>v===null||v===undefined?'—':typeof v==='number'?new Intl.NumberFormat('en',{maximumFractionDigits:2}).format(v):esc(v);
async function load(){app.innerHTML='<div class="empty">Loading privacy-safe product metrics…</div>';try{const r=await fetch(`dashboard?days=${days}`,{cache:'no-store'});if(!r.ok)throw Error(`HTTP ${r.status}`);render(await r.json())}catch(e){app.innerHTML=`<div class="error"><b>Statistics unavailable</b><br>${esc(e.message)}</div>`}}
function bindDetails(){const saved=JSON.parse(localStorage.getItem('narra-dashboard-sections')||'{}');document.querySelectorAll('details[data-section]').forEach(node=>{if(node.dataset.section in saved)node.open=!!saved[node.dataset.section];node.ontoggle=()=>{saved[node.dataset.section]=node.open;localStorage.setItem('narra-dashboard-sections',JSON.stringify(saved))}})}
function render(d){const max=Math.max(1,...d.series.flatMap(x=>[x.active,x.sessions,x.tools]));const cards=d.primary.map(x=>`<div class="card" title="${esc(x.note)}"><div class="label metric-help">${esc(x.label)}</div><div class="value">${fmt(x.value)}</div><div class="note">${esc(x.note)}</div></div>`).join('');const bars=d.series.length?d.series.map(x=>`<div class="bar-group" title="${esc(x.label)} · active ${x.active}, sessions ${x.sessions}, tools ${x.tools}"><i class="bar" style="height:${x.active/max*100}%"></i><i class="bar sessions" style="height:${x.sessions/max*100}%"></i><i class="bar tools" style="height:${x.tools/max*100}%"></i><span>${esc(x.label)}</span></div>`).join(''):'<div class="empty">No observed activity yet</div>';const features=d.features.length?d.features.map(x=>`<div class="row"><div><span>${esc(x.name)}</span><div class="track"><div class="fill" style="width:${Math.min(100,x.adoption)}%"></div></div></div><b>${fmt(x.adoption)}%</b></div>`).join(''):'<div class="empty">No feature events yet</div>';const funnels=d.funnels.map(x=>`<div class="row"><span>${esc(x.label)}<div class="note">${x.completed} of ${x.started} ${esc(x.unit)}</div></span><b>${x.rate===null?'—':fmt(x.rate)+'%'}</b></div>`).join('');const warns=d.quality.warnings.length?d.quality.warnings.map(x=>`<div class="warning">${esc(x)}</div>`).join(''):'<div class="ok">Data-quality checks have no active warnings.</div>';const retention=['d1','d7','d30'].map(key=>{const x=d.retention[key];return `<div class="mini" title="Rolling return on or after the horizon, anchored to first qualified reading session"><span class="label metric-help">Rolling ${key.toUpperCase()}+ retention</span><b>${x.rate===null?'—':fmt(x.rate)+'%'}</b><span class="note">${x.returned} / ${x.eligible} mature actors</span></div>`}).join('');app.innerHTML=`<section class="grid">${cards}</section><section class="layout"><details class="panel" data-section="activity" open><summary>Activity over available history</summary><div class="inside"><div class="sub">No zero-filling before collection started</div><div class="chart">${bars}</div><div class="legend"><span><i style="background:var(--acid)"></i>Active</span><span><i style="background:#111"></i>Qualified sessions</span><span><i style="background:var(--blue)"></i>AI tools</span></div></div></details><details class="panel" data-section="features" open><summary>Feature adoption</summary><div class="inside"><div class="sub">Share of active pseudonymous actors</div><div class="rows">${features}</div></div></details></section><section class="layout"><details class="panel" data-section="ai" open><summary>AI reliability, latency and cost</summary><div class="inside"><div class="sub">Requests count once; provider retries are attempts</div><div class="ai"><div class="mini"><span class="label">Requests</span><b>${fmt(d.ai.requests)}</b></div><div class="mini"><span class="label">Success</span><b>${d.ai.success_rate===null?'—':fmt(d.ai.success_rate)+'%'}</b></div><div class="mini"><span class="label">Attempts / request</span><b>${fmt(d.ai.attempts_per_request)}</b></div><div class="mini"><span class="label">p50 / p95 latency</span><b>${fmt(d.ai.latency_p50_ms)} / ${fmt(d.ai.latency_p95_ms)}</b><span class="note">milliseconds</span></div><div class="mini"><span class="label">Known provider cost (${esc(d.ai.cost_currency)})</span><b>${fmt(d.ai.known_cost)}</b><span class="note">${fmt(d.ai.cost_coverage)}% coverage · not a total if below 100%</span></div><div class="mini"><span class="label">Helpful answers</span><b>${d.ai.helpful_rate===null?'—':fmt(d.ai.helpful_rate)+'%'}</b><span class="note">${d.ai.feedback_count} ratings · producer planned</span></div></div></div></details><details class="panel" data-section="funnels" open><summary>Product and update funnels</summary><div class="inside"><div class="sub">Units are shown per funnel row within the selected window</div><div class="rows">${funnels}</div></div></details></section><section class="layout"><details class="panel" data-section="retention" open><summary>Mature cohort retention</summary><div class="inside"><div class="retention">${retention}</div></div></details><details class="panel" data-section="reading" open><summary>Reading engagement</summary><div class="inside"><div class="ai"><div class="mini"><span class="label">Reading minutes</span><b>${fmt(d.engagement.reading_minutes)}</b></div><div class="mini"><span class="label">Qualified sessions</span><b>${fmt(d.engagement.sessions)}</b></div></div></div></details></section><details class="panel quality" data-section="quality" open><summary>Data quality</summary><div class="inside"><div class="sub">Coverage from ${esc(d.quality.data_start||'no events')} · session IDs ${fmt(d.quality.session_id_coverage)}% · request IDs ${fmt(d.quality.request_id_coverage)}%</div>${warns}</div></details><div class="footer"><span>Only observed events · no legacy reconstruction</span><span>Updated ${esc(d.updated_at)}</span></div>`;bindDetails()}
document.querySelectorAll('[data-days]').forEach(b=>b.onclick=()=>{days=Number(b.dataset.days);document.querySelectorAll('[data-days]').forEach(x=>x.classList.toggle('active',x===b));load()});load();
</script></body></html>
