name: Signed macOS release
on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Exact tag to build, for example v0.7.7'
        required: true
        type: string
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: macos-14
    # Configure required reviewers and branch/tag protection for this GitHub Environment.
    environment: narra-production
    env:
      NODE_ENV: production
      NARRA_PROXY_URL: ${{ secrets.NARRA_PROXY_URL }}
      NARRA_ACTIVATION_TOKEN: ${{ secrets.NARRA_ACTIVATION_TOKEN }}
      NARRA_UPDATE_BASE_URL: ${{ secrets.NARRA_UPDATE_BASE_URL }}
      CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
      CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.release_version || github.ref_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Both tag pushes and manual runs build the exact immutable tag that
          # is verified below, never whatever happens to be the default branch.
          ref: ${{ env.RELEASE_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - name: Verify release tag matches package version
        run: node scripts/verify-release-tag.mjs "$RELEASE_VERSION"
      - name: Materialize App Store Connect key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          umask 077
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          test -n "$APPLE_API_KEY_P8"
          printf '%s' "$APPLE_API_KEY_P8" > "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm ci --prefix server
      - run: npm audit --audit-level=moderate
      - run: npm audit --prefix server --audit-level=moderate
      - run: python -m venv stats/.venv && stats/.venv/bin/pip install -r stats/requirements.txt
      - run: npm run typecheck && npm run test:gateway && npm run test:stats
      - run: npm run dist
      - run: bash scripts/notarize-dmg.sh
      - run: npm run smoke:pdf-worker
      - run: npm run release:verify
      - run: npm sbom --sbom-format cyclonedx > "release/Narra-${RELEASE_VERSION}.cdx.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Narra-${{ env.RELEASE_VERSION }}-universal
          path: |
            release/Narra-*-universal.dmg
            release/Narra-*-universal.zip
            release/latest-mac.yml
            release/*.blockmap
            release/Narra-*-universal.dmg.sha256
            release/Narra-*-universal.zip.sha256
            release/*.cdx.json
          if-no-files-found: error
      - name: Remove temporary notarization key
        if: always()
        run: |
          case "${APPLE_API_KEY:-}" in
            "$RUNNER_TEMP"/AuthKey_*.p8) [ ! -f "$APPLE_API_KEY" ] || rm -f -- "$APPLE_API_KEY" ;;
          esac
