name: CI
on:
  pull_request:
  push:
    branches: ['feat/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm ci --prefix server
      - run: npm audit --audit-level=moderate
      - run: npm audit --prefix server --audit-level=moderate
      - run: npm run typecheck
      - run: npm run test:gateway
      - run: python -m venv stats/.venv && stats/.venv/bin/pip install -r stats/requirements.txt
      - run: npm run test:stats
      - run: npm run build
      - run: npm run dist:unsigned
      - run: npm run release:verify:unsigned
      - run: npm run smoke:pdf-worker
